<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Adrián Boza Suárez — Cloud · DevSecOps · Cloud Security</title>
  <desc id="d">Terminal-style banner: whoami prints Adrián Boza Suárez, junior cloud and security engineer in Madrid.</desc>
  <style>
    :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --mute:#8b949e; --acc:#3fb950; --acc2:#58a6ff; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --fg:#1f2328; --mute:#57606a; --acc:#1a7f37; --acc2:#0969da; }
    }
    .bg { fill:var(--bg); }
    .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mute { fill:var(--mute); }
    .fg { fill:var(--fg); }
    .acc { fill:var(--acc); }
    .acc2 { fill:var(--acc2); }
    .ring { fill:none; stroke:var(--acc); stroke-width:1.5; }
    .grid { stroke:var(--line); stroke-width:1; opacity:.45; }
    .l1, .l2, .l3, .l4 { opacity:0; animation: show .01s forwards; }
    .l1 { animation-delay: .9s; } .l2 { animation-delay: 1.5s; } .l3 { animation-delay: 2.1s; } .l4 { animation-delay: 2.7s; }
    .type { clip-path: inset(0 100% 0 0); animation: type .8s steps(14) .1s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { to { opacity:1; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4 { opacity:1; animation:none; }
      .type { clip-path:none; animation:none; }
      .cursor { animation:none; }
    }
  </style>

  <rect class="bg" width="1200" height="300" rx="14"/>

  <!-- right side: network of nodes (on-prem -> cloud) -->
  <g transform="translate(860 40)">
    <g class="grid">
      <line x1="40" y1="40" x2="150" y2="110"/><line x1="150" y1="110" x2="270" y2="50"/>
      <line x1="150" y1="110" x2="110" y2="200"/><line x1="150" y1="110" x2="250" y2="190"/>
      <line x1="40" y1="40" x2="110" y2="200"/><line x1="270" y1="50" x2="250" y2="190"/>
    </g>
    <circle cx="40" cy="40" r="7" class="acc2"/>
    <circle cx="270" cy="50" r="7" class="acc2"/>
    <circle cx="110" cy="200" r="7" class="acc2"/>
    <circle cx="250" cy="190" r="7" class="acc2"/>
    <circle cx="150" cy="110" r="13" class="acc"/>
    <circle cx="150" cy="110" r="22" class="ring" opacity=".5">
      <animate attributeName="r" values="14;30;14" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- terminal -->
  <rect class="panel" x="40" y="36" width="780" height="228" rx="10"/>
  <circle cx="64" cy="58" r="6" fill="#ff5f57"/><circle cx="84" cy="58" r="6" fill="#febc2e"/><circle cx="104" cy="58" r="6" fill="#28c840"/>
  <text x="430" y="63" text-anchor="middle" class="mono mute" font-size="14">adrian@madrid: ~</text>

  <g class="mono" font-size="22">
    <text x="66" y="112"><tspan class="acc">$</tspan> <tspan class="fg type">whoami</tspan></text>
  </g>
  <text x="66" y="160" class="sans fg l1" font-size="38" font-weight="700">Adrián Boza Suárez</text>
  <text x="66" y="198" class="mono acc2 l2" font-size="20">Cloud · DevSecOps · Cloud Security</text>
  <text x="66" y="232" class="mono mute l3" font-size="17">Madrid · network ops background · building on Azure &amp; AWS</text>
  <g class="l4"><rect class="acc cursor" x="66" y="244" width="12" height="4"/></g>
</svg>
